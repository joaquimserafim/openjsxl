name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# PR numbers distinguish forks with the same branch name. Push runs remain independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm must be installed before setup-node so its `cache: pnpm` works.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - id: install
        run: pnpm install --frozen-lockfile

      - name: Workspace dependency audit (nonblocking triage)
        id: workspace_audit
        continue-on-error: true
        run: pnpm audit

      # Keep this command unmasked: advisories and registry/network failures must fail CI.
      - name: Production dependency audit (blocking)
        id: production_audit
        run: pnpm audit --prod

      - name: Dependency audit summary
        if: ${{ always() }}
        env:
          WORKSPACE_AUDIT_OUTCOME: ${{ steps.workspace_audit.outcome }}
          PRODUCTION_AUDIT_OUTCOME: ${{ steps.production_audit.outcome }}
        run: |
          {
            echo '## Dependency audits'
            echo "- Production audit (blocking): **$PRODUCTION_AUDIT_OUTCOME**"
            echo "- Full workspace audit (triage): **$WORKSPACE_AUDIT_OUTCOME**"
            echo ''
            echo 'The production filter includes the pnpm bootstrap graph.'
            echo 'The full audit also includes development tooling and private benchmark comparators.'
            echo 'A failure can mean advisories or an incomplete registry request; inspect the step log.'
            echo 'Classify affected paths and reachability using docs/dependency-audit.md.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$WORKSPACE_AUDIT_OUTCOME" = failure ]; then
            echo '::warning title=Workspace dependency audit requires triage::Advisories were found or the audit could not complete. Review the workspace audit log and docs/dependency-audit.md.'
          fi

      # Code checks still run after a failed audit, which still fails the job, so advisories or an
      # audit-endpoint outage never hide their results. Test stays before Build: tests run from source.
      - name: Lint (Biome)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build
